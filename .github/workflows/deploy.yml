name: CI/CD бота-напоминателя

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - test
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit-tests:
    name: Модульные тесты
    runs-on: ubuntu-latest
    steps:
      - name: Получение кода
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Установка зависимостей
        run: python -m pip install -r requirements.txt

      - name: Запуск модульных тестов
        run: python -m unittest discover -s tests

  deploy:
    name: Развертывание тестовой или рабочей версии
    needs: unit-tests
    if: >-
      (github.event_name == 'pull_request' &&
       github.base_ref == 'test' &&
       github.head_ref == 'dev' &&
       !github.event.pull_request.draft &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: [self-hosted, tunmonitor]
    concurrency:
      group: reminder-bot-deploy-${{ github.event_name == 'pull_request' && github.base_ref || github.ref }}
      cancel-in-progress: false
    steps:
      - name: Получение версии для развертывания
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Развертывание и запуск бота
        shell: bash
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            if [ "$GITHUB_BASE_REF" != "test" ] || [ "$GITHUB_HEAD_REF" != "dev" ]; then
              echo "В тестовое окружение можно развернуть только PR из dev в test." >&2
              exit 1
            fi
            TARGET_DIR="/mnt/external_data/reminder_bot/test"
            SHM_DIR="/dev/shm/reminder_bot/test"
            echo "Развертывается проверяемый commit из dev в тестовое окружение."
          elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
            TARGET_DIR="/home/pi/app/reminder_bot/prod"
            SHM_DIR="/dev/shm/reminder_bot/prod"
            echo "Развертывается commit из main в рабочее окружение."
          else
            echo "Неподдерживаемое событие развертывания: $GITHUB_EVENT_NAME $GITHUB_REF" >&2
            exit 1
          fi
          LOG_DIR="$SHM_DIR"

          mkdir -p "$TARGET_DIR"

          echo "Остановка текущего бота перед синхронизацией файлов..."
          if [ -f "$TARGET_DIR/manage.sh" ]; then
            (
              cd "$TARGET_DIR"
              SHM_DIR="$SHM_DIR" LOG_DIR="$LOG_DIR" bash ./manage.sh stop
            )
          fi

          echo "Синхронизация кода проекта в $TARGET_DIR..."
          rsync -a --checksum --delete \
            --exclude='/.git/' \
            --exclude='/.env' \
            --exclude='/.env.*' \
            --exclude='/credentials.env' \
            --exclude='/reminder_bot_credentials.env' \
            --exclude='/templates.json' \
            --exclude='/reminder_bot_templates.json' \
            --exclude='/schedule_config.json' \
            --exclude='/reminder_bot_schedule_config.json' \
            --exclude='/logs_backup/' \
            --exclude='/reminder_bot_logs_backup/' \
            --exclude='*.log' \
            --exclude='/__pycache__/' \
            --exclude='/venv/' \
            --exclude='/.venv/' \
            --exclude='/test/' \
            --exclude='/qodo_review.md' \
            ./ "$TARGET_DIR/"

          chmod +x "$TARGET_DIR/manage.sh"

          cd "$TARGET_DIR"
          if [ ! -x "$TARGET_DIR/venv/bin/python3" ]; then
            python3 -m venv "$TARGET_DIR/venv"
          fi
          BOT_PYTHON="$TARGET_DIR/venv/bin/python3"

          echo "Установка зависимостей из requirements.txt..."
          "$BOT_PYTHON" -m pip install -r "$TARGET_DIR/requirements.txt"

          echo "Запуск бота..."
          SHM_DIR="$SHM_DIR" LOG_DIR="$LOG_DIR" RUNNER_TRACKING_ID=0 ./manage.sh start

          echo "Проверка состояния бота..."
          SHM_DIR="$SHM_DIR" LOG_DIR="$LOG_DIR" ./manage.sh status
