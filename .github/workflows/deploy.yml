name: CI/CD бота-напоминателя

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - test
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit-tests:
    name: Модульные тесты
    runs-on: ubuntu-latest
    steps:
      - name: Получение кода
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Установка зависимостей
        run: python -m pip install -r requirements.txt

      - name: Запуск модульных тестов
        run: python -m unittest discover -s tests

  deploy:
    name: Развертывание тестовой или рабочей версии
    needs: unit-tests
    if: >-
      (github.event_name == 'pull_request' &&
       github.base_ref == 'test' &&
       github.head_ref == 'dev' &&
       !github.event.pull_request.draft &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: [self-hosted, tunmonitor]
    concurrency:
      group: reminder-bot-deploy-${{ github.event_name == 'pull_request' && github.base_ref || github.ref }}
      cancel-in-progress: false
    steps:
      - name: Получение версии для развертывания
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Развертывание и запуск бота
        shell: bash
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            if [ "$GITHUB_BASE_REF" != "test" ] || [ "$GITHUB_HEAD_REF" != "dev" ]; then
              echo "В тестовое окружение можно развернуть только PR из dev в test." >&2
              exit 1
            fi
            TARGET_DIR="/mnt/external_data/reminder_bot/test"
            SHM_DIR="/dev/shm/reminder_bot/test"
            echo "Развертывается проверяемый commit из dev в тестовое окружение."
          elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
            TARGET_DIR="/home/pi/app/reminder_bot/prod"
            SHM_DIR="/dev/shm/reminder_bot/prod"
            echo "Развертывается commit из main в рабочее окружение."
          else
            echo "Неподдерживаемое событие развертывания: $GITHUB_EVENT_NAME $GITHUB_REF" >&2
            exit 1
          fi
          LOG_DIR="$SHM_DIR"

          mkdir -p "$TARGET_DIR"

          VENV_DIR="$TARGET_DIR/venv"
          REQ_FILE="$GITHUB_WORKSPACE/requirements.txt"
          REQ_HASH_FILE="$VENV_DIR/.requirements.sha256"

          if [ ! -x "$VENV_DIR/bin/python3" ]; then
            echo "venv отсутствует — создаём..."
            python3 -m venv "$VENV_DIR"
          fi

          BOT_PYTHON="$VENV_DIR/bin/python3"
          CURRENT_HASH=$(sha256sum "$REQ_FILE" | awk '{print $1}')

          NEED_INSTALL=0
          if [ ! -f "$REQ_HASH_FILE" ]; then
            echo "Хеш requirements.txt не сохранён — установим зависимости..."
            NEED_INSTALL=1
          elif [ "$(cat "$REQ_HASH_FILE")" != "$CURRENT_HASH" ]; then
            echo "requirements.txt изменился — обновляем зависимости..."
            NEED_INSTALL=1
          else
            echo "requirements.txt не менялся — pip install пропущен."
          fi

          if [ "$NEED_INSTALL" -eq 1 ]; then
            "$BOT_PYTHON" -m pip install --upgrade pip
            "$BOT_PYTHON" -m pip install -r "$REQ_FILE"
            echo "$CURRENT_HASH" > "$REQ_HASH_FILE"
          fi

          bot_stopped=0
          deploy_succeeded=0
          restart_after_failure() {
            result=$?
            if [ "$bot_stopped" -eq 1 ] && [ "$deploy_succeeded" -eq 0 ]; then
              echo "Ошибка развертывания; пытаемся снова запустить бота." >&2
              (
                cd "$TARGET_DIR"
                SHM_DIR="$SHM_DIR" LOG_DIR="$LOG_DIR" RUNNER_TRACKING_ID=0 \
                    ./manage.sh start
              ) || echo "Не удалось автоматически запустить бота." >&2
            fi
            exit "$result"
          }
          trap restart_after_failure EXIT

          echo "Остановка текущего бота перед синхронизацией файлов..."
          if [ -f "$TARGET_DIR/manage.sh" ]; then
            bot_stopped=1
            (
              cd "$TARGET_DIR"
              SHM_DIR="$SHM_DIR" LOG_DIR="$LOG_DIR" bash ./manage.sh stop
            )
          fi

          echo "Синхронизация кода проекта в $TARGET_DIR..."
          rsync -a --checksum --delete \
            --exclude='/.git/' \
            --exclude='/.env' \
            --exclude='/.env.*' \
            --exclude='/credentials.env' \
            --exclude='/reminder_bot_credentials.env' \
            --exclude='/templates.json' \
            --exclude='/reminder_bot_templates.json' \
            --exclude='/schedule_config.json' \
            --exclude='/reminder_bot_schedule_config.json' \
            --exclude='/logs_backup/' \
            --exclude='/reminder_bot_logs_backup/' \
            --exclude='*.log' \
            --exclude='/__pycache__/' \
            --exclude='/venv/' \
            --exclude='/.venv/' \
            --exclude='/test/' \
            --exclude='/qodo_review.md' \
            ./ "$TARGET_DIR/"

          chmod +x "$TARGET_DIR/manage.sh"

          cd "$TARGET_DIR"
          echo "Запуск бота..."
          SHM_DIR="$SHM_DIR" LOG_DIR="$LOG_DIR" RUNNER_TRACKING_ID=0 ./manage.sh start

          echo "Проверка состояния бота..."
          SHM_DIR="$SHM_DIR" LOG_DIR="$LOG_DIR" ./manage.sh status
          bot_stopped=0
          deploy_succeeded=1
